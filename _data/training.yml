- slug: employee-cyber-awareness
  name: "Employee Cyber Awareness"
  description: "A half-day or modular programme building practical cyber awareness across all staff, from phishing recognition to safe data handling."
  audience: "All staff, SME to mid-market"
  format: "Half day onsite or remote, or short modules"
  capability: null
  published: true

- slug: executive-board-briefing
  name: "Executive & Board Briefing"
  description: "A focused 60 to 90 minute briefing giving boards and trustees the intelligence-risk literacy needed to govern, not just delegate, cyber and fraud exposure."
  audience: "C-suite, trustees, partners"
  format: "60 to 90 minutes"
  capability: null
  published: true

- slug: ai-threat-awareness
  name: "AI Threat Awareness"
  description: "A half-day programme for finance, HR and executive assistants on recognising AI-enhanced fraud, synthetic voice, deepfake video calls, and AI-generated business email compromise."
  audience: "Finance, HR, executive assistants"
  format: "Half day"
  capability: ai-synthetic-intelligence
  published: true

- slug: phishing-social-engineering-simulation
