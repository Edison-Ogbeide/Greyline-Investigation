  audience: "Whole organisation"
  format: "Programme over 4 to 12 weeks"
  capability: cyber-intelligence
  published: true

- slug: incident-response-exercises
  name: "Incident Response Exercises"
  description: "A half-day tabletop exercise testing leadership and IT's actual incident response against a realistic, scenario-led simulation."
  audience: "Leadership and IT"
  format: "Half-day tabletop"
  capability: null
  published: true

- slug: legal-sector-cpd
