[build]
  command = "bundle exec jekyll build"
  publish = "_site"

[build.environment]
  RUBY_VERSION = "3.3.11"

# Security headers, applied to every response. Content-Security-Policy is
# deliberately not set here: the site has several inline <style> blocks and
# an inline GA4 script that a strict CSP would break without careful
# allowlisting, so it needs a separate, tested pass rather than being
# bundled in with these low-risk headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

