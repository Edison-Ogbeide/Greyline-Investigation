[build]
  command = "bundle exec jekyll build"
  publish = "_site"

[build.environment]
  RUBY_VERSION = "3.3.11"

# Security headers, applied to every response, plus a noindex directive
# while the site is a holding page: search engines should not index or
# follow anything here until the business resumes trading.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Robots-Tag = "noindex, nofollow"

# Every previously published URL (services, capabilities, enquiry forms,
# locations, legal pages, etc.) now resolves to the holding page instead
# of a 404, for as long as the company is not trading.
[[redirects]]
  from = "/*"
  to = "/"
  status = 200
