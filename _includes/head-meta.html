<!-- Analytics is consent-gated: see cookie-consent.html. No tag fires here
     until the visitor has accepted, in line with PECR and the Cookie Policy. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
<link rel="alternate icon" href="{{ '/favicon.svg' | relative_url }}">
<title>{{ page.title }}{% unless page.no_brand_suffix %} | Greyline Investigations{% endunless %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ page.canonical | default: page.url | absolute_url }}">
{% if page.noindex %}<meta name="robots" content="noindex,nofollow">{% endif %}
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.title }}{% unless page.no_brand_suffix %} | Greyline Investigations{% endunless %}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ page.canonical | default: page.url | absolute_url }}">
{% if page.og_image %}
<meta property="og:image" content="{{ page.og_image | absolute_url }}">
{% if page.og_image_width %}<meta property="og:image:width" content="{{ page.og_image_width }}">{% endif %}
{% if page.og_image_height %}<meta property="og:image:height" content="{{ page.og_image_height }}">{% endif %}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ page.og_image | absolute_url }}">
{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
{% if page.last_reviewed %}<meta name="last-reviewed" content="{{ page.last_reviewed }}">{% endif %}
