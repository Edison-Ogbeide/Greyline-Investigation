<!-- Called as: include capability-icon.html, passing slug=cap.slug.
     Renders a simple line-art SVG icon for one of the six capability lines. -->
{% case include.slug %}
{% when "corporate-intelligence" %}
<svg class="cap-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
	<rect x="8" y="16" width="24" height="16" stroke="currentColor" stroke-width="1.4"/>
	<path d="M15 16V11a5 5 0 0 1 10 0v5" stroke="currentColor" stroke-width="1.4"/>
	<line x1="8" y1="22" x2="32" y2="22" stroke="currentColor" stroke-width="1.2"/>
	<line x1="18" y1="22" x2="18" y2="26" stroke="currentColor" stroke-width="1.2"/>
	<line x1="22" y1="22" x2="22" y2="26" stroke="currentColor" stroke-width="1.2"/>
</svg>
{% when "fraud-intelligence" %}
<svg class="cap-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
	<circle cx="17" cy="17" r="9" stroke="currentColor" stroke-width="1.4"/>
	<line x1="23.5" y1="23.5" x2="33" y2="33" stroke="currentColor" stroke-width="1.4"/>

</svg>
{% when "ai-synthetic-intelligence" %}
<svg class="cap-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

{% when "litigation-intelligence" %}
