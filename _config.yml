title: Greyline Investigations
description: "Website under development. Not currently trading or accepting clients."
url: "https://greylineinvestigations.co.uk"
baseurl: ""
theme: null

# Jekyll excludes dotfiles by default. .well-known/security.txt needs
# an explicit include or it never reaches _site.
include:
  - .well-known

exclude:
  - Gemfile
  - Gemfile.lock
  - README.txt
  - LICENSE.txt
  - node_modules
  - vendor
