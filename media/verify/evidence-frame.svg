<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000" role="img" aria-label="Verify construction monitoring capture frame with fixed vantage index and capture metadata">
  <style>
    svg { --ink:#16181A; --concrete:#6E7276; --paper:#EDEEEC; --laterite:#A8452A; --hairline:#C9CBC7; }
    .mono { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    .lbl  { font-size:13px; letter-spacing:1.6px; fill:#9BA0A3; }
    .val  { font-size:19px; letter-spacing:0.2px; fill:#EDEEEC; }
    .tiny { font-size:11px; letter-spacing:1.4px; fill:#9BA0A3; }
    .mark { font-size:14px; letter-spacing:3px; fill:#EDEEEC; }
  </style>

  <defs>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#3A3E41"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#44494C" stroke-width="6"/>
    </pattern>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16181A" stop-opacity="0"/>
      <stop offset="1" stop-color="#16181A" stop-opacity="0.94"/>
    </linearGradient>
  </defs>

  <!-- ============ REPLACE THIS RECT WITH THE SITE PHOTOGRAPH ============ -->
  <!-- <image href="frame.jpg" x="0" y="0" width="1500" height="1000" preserveAspectRatio="xMidYMid slice"/> -->
  <rect width="1500" height="1000" fill="url(#hatch)"/>
  <text class="mono" x="750" y="470" text-anchor="middle" font-size="17" letter-spacing="4" fill="#8C9296">SITE PHOTOGRAPH</text>
  <text class="mono" x="750" y="500" text-anchor="middle" font-size="13" letter-spacing="2" fill="#70767A">3:2 · CAPTURED AT FIXED VANTAGE V2</text>
  <!-- =================================================================== -->

  <!-- fixed vantage index badge -->
  <g>
    <rect x="34" y="34" width="186" height="196" fill="#16181A" fill-opacity="0.82"/>
    <text class="mono tiny" x="50" y="58">FIXED VANTAGE INDEX</text>
    <line x1="50" y1="70" x2="204" y2="70" stroke="#4A4F52" stroke-width="1"/>

    <!-- plot boundary -->
    <rect x="58" y="86" width="138" height="112" fill="none" stroke="#7B8185" stroke-width="1.5" stroke-dasharray="5 4"/>
    <!-- building footprint -->
    <rect x="96" y="114" width="62" height="58" fill="#EDEEEC" fill-opacity="0.13" stroke="#EDEEEC" stroke-width="1.2"/>
    <!-- active view cone from V2 -->
    <polygon points="184,96 128,108 152,164" fill="#A8452A" fill-opacity="0.34"/>
    <!-- vantage markers -->
    <circle cx="70" cy="96" r="4.5" fill="#EDEEEC" fill-opacity="0.5"/>
    <circle cx="184" cy="96" r="6" fill="#A8452A"/>
    <circle cx="70" cy="188" r="4.5" fill="#EDEEEC" fill-opacity="0.5"/>
    <circle cx="184" cy="188" r="4.5" fill="#EDEEEC" fill-opacity="0.5"/>
    <text class="mono" x="60" y="90" font-size="10" fill="#9BA0A3">V1</text>
    <text class="mono" x="166" y="90" font-size="10" fill="#EDEEEC">V2</text>
    <text class="mono" x="60" y="206" font-size="10" fill="#9BA0A3">V3</text>
    <text class="mono" x="166" y="206" font-size="10" fill="#9BA0A3">V4</text>
    <text class="mono" x="50" y="224" font-size="11" letter-spacing="1.4" fill="#EDEEEC">V2 · NORTH-EAST</text>
  </g>

  <!-- corner mark -->
  <g>
    <text class="mono mark" x="1466" y="60" text-anchor="end">GREYLINE VERIFY</text>
    <text class="mono tiny" x="1466" y="82" text-anchor="end">SITE RECORD · UNALTERED CAPTURE</text>
    <line x1="1300" y1="98" x2="1466" y2="98" stroke="#A8452A" stroke-width="2"/>
  </g>

  <!-- metadata scrim -->
  <rect x="0" y="770" width="1500" height="230" fill="url(#scrim)"/>
  <line x1="0" y1="838" x2="1500" y2="838" stroke="#A8452A" stroke-width="2"/>

  <g class="mono">
    <!-- row 1 -->
    <text class="lbl" x="40"   y="878">CAPTURED</text>
    <text class="val" x="40"   y="904">2026-07-14  09:42:17 WAT</text>

    <text class="lbl" x="470"  y="878">POSITION</text>
    <text class="val" x="470"  y="904">6.5244 N   3.3792 E   ±4 m</text>

    <text class="lbl" x="900"  y="878">BEARING / ELEVATION</text>
    <text class="val" x="900"  y="904">142°   ·   38 m</text>

    <text class="lbl" x="1240" y="878">SCALE REFERENCE</text>
    <text class="val" x="1240" y="904">2.0 m rod, frame left</text>

    <!-- row 2 -->
    <text class="lbl" x="40"   y="944">RECORD REFERENCE</text>
    <text class="val" x="40"   y="970">GV-2417 / 07 / V2 / 004</text>

    <text class="lbl" x="470"  y="944">FILE INTEGRITY (SHA-256)</text>
    <text class="val" x="470"  y="970">9f3c 41ba 77d0 2e5c ... a17d</text>

    <text class="lbl" x="900"  y="944">ATTENDANCE</text>
    <text class="val" x="900"  y="970">In-country associate ref A-118</text>

    <text class="lbl" x="1240" y="944">REVIEW</text>
    <text class="val" x="1240" y="970">Principal, pre-release</text>
  </g>
</svg>
