<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Greyline BuildWatch share card">
  <style>
    .mono { font-family:"SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    .serif{ font-family: Georgia, "Times New Roman", serif; }
  </style>

  <rect width="1200" height="630" fill="#16181A"/>

  <!-- vantage index motif, oversized and cropped -->
  <g opacity="0.5">
    <rect x="856" y="176" width="286" height="234" fill="none" stroke="#4A4F52" stroke-width="2" stroke-dasharray="9 7"/>
    <rect x="936" y="234" width="128" height="120" fill="#EDEEEC" fill-opacity="0.05" stroke="#6E7276" stroke-width="1.6"/>
    <polygon points="1122,198 1000,224 1046,332" fill="#A8452A" fill-opacity="0.28"/>
    <circle cx="866" cy="198" r="7" fill="#6E7276"/>
    <circle cx="1122" cy="198" r="10" fill="#A8452A"/>
    <circle cx="866" cy="392" r="7" fill="#6E7276"/>
    <circle cx="1122" cy="392" r="7" fill="#6E7276"/>
    <text class="mono" x="846" y="188" font-size="14" fill="#6E7276">V1</text>
    <text class="mono" x="1096" y="186" font-size="14" fill="#EDEEEC">V2</text>
    <text class="mono" x="846" y="418" font-size="14" fill="#6E7276">V3</text>
    <text class="mono" x="1096" y="418" font-size="14" fill="#6E7276">V4</text>
  </g>

  <line x1="72" y1="96" x2="240" y2="96" stroke="#A8452A" stroke-width="3"/>
  <text class="mono" x="72" y="140" font-size="15" letter-spacing="5" fill="#9BA0A3">GREYLINE INVESTIGATIONS</text>

  <text class="serif" x="72" y="266" font-size="76" fill="#EDEEEC">BuildWatch</text>
  <text class="serif" x="72" y="330" font-size="30" fill="#B7BBBD">Independent verification of what is</text>
  <text class="serif" x="72" y="374" font-size="30" fill="#B7BBBD">actually happening on your building site.</text>

  <line x1="72" y1="452" x2="760" y2="452" stroke="#3A3E41" stroke-width="1"/>
  <g class="mono" font-size="15" letter-spacing="2" fill="#9BA0A3">
    <text x="72" y="490">FIXED VANTAGE POINTS</text>
    <text x="342" y="490">GEOTAGGED RECORD</text>
    <text x="586" y="490">PRINCIPAL-REVIEWED</text>
  </g>

  <text class="mono" x="72" y="566" font-size="14" letter-spacing="1.6" fill="#6E7276">Monthly · Nigeria</text>
</svg>
